name: A5 Smoke

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      device_id:
        description: "task-submit device id, or auto"
        required: false
        default: "0"
        type: string
      ascend_home_path:
        description: "Override ASCEND_HOME_PATH on the runner"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    a5-smoke-${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref
    }}
  cancel-in-progress: false

jobs:
  smoke:
    # The active A5 runner is managed by the non-root zoujiangjiangCI account on host 39.
    runs-on: [self-hosted, a5]
    timeout-minutes: 120

    # Git over the flaky intranet route to github.com benefits from HTTP/1.1
    # (avoids HTTP/2 stream resets seen through middleboxes) and from failing
    # fast when a transfer stalls, so the retry step below kicks in promptly
    # instead of hanging on one curl attempt for minutes.
    env:
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: "http.version"
      GIT_CONFIG_VALUE_0: "HTTP/1.1"
      GIT_CONFIG_KEY_1: "http.lowSpeedLimit"
      GIT_CONFIG_VALUE_1: "1000"
      GIT_CONFIG_KEY_2: "http.lowSpeedTime"
      GIT_CONFIG_VALUE_2: "45"

    steps:
      - name: Resolve trigger context
        id: trigger
        uses: actions/github-script@v7
        with:
          script: |
            const isPullRequest = context.eventName === "pull_request";
            let repository = `${context.repo.owner}/${context.repo.repo}`;
            let ref = context.ref.replace("refs/heads/", "");
            let sha = context.sha;
            let prNumber = "";

            if (isPullRequest) {
              const pr = context.payload.pull_request;
              repository = pr.head.repo.full_name;
              ref = pr.head.sha;
              sha = pr.head.sha;
              prNumber = String(pr.number);
            }

            core.setOutput("repository", repository);
            core.setOutput("ref", ref);
            core.setOutput("sha", sha);
            core.setOutput("pr_number", prNumber);

      # The runner's direct route to github.com is intermittently unavailable
      # (connect timeouts / mid-transfer drops). Keep actions/checkout as the
      # fast path but tolerate its failure; the next step verifies the result,
      # restores the source tree, and retries the fetch if needed.
      - name: Checkout target ref
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.trigger.outputs.repository }}
          ref: ${{ steps.trigger.outputs.ref }}
          fetch-depth: 1
          clean: false

      # Runs only when the trigger resolved successfully and the job is not
      # cancelled; a failed/cancelled run must not retry network fetches.
      # The proxy fallback (A5_SMOKE_GH_PROXY) is applied only on the dedicated
      # retry attempts; otherwise the runner's existing network configuration
      # is inherited and restored afterwards, never cleared unconditionally.
      - name: Ensure target ref checked out
        if: ${{ !cancelled() && success() }}
        shell: bash
        env:
          TARGET_REPO: ${{ steps.trigger.outputs.repository }}
          TARGET_SHA: ${{ steps.trigger.outputs.sha }}
          FALLBACK_PROXY: ${{ vars.A5_SMOKE_GH_PROXY || '' }}
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE}"
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid target SHA '${TARGET_SHA}'." >&2
            exit 1
          fi

          fetch_url="https://github.com/${TARGET_REPO}.git"
          if [[ ! -d "${ws}/.git" ]]; then
            git -C "${ws}" init -q
            git -C "${ws}" remote add origin "${fetch_url}"
          else
            git -C "${ws}" remote set-url origin "${fetch_url}"
          fi

          current="$(git -C "${ws}" rev-parse HEAD 2>/dev/null || true)"
          if [[ -z "${current}" || "${current}" != "${TARGET_SHA}" ]]; then
            proxy_vars=(https_proxy http_proxy HTTPS_PROXY HTTP_PROXY)
            saved_proxy_env=()
            for v in "${proxy_vars[@]}"; do
              if [[ -v ${v} ]]; then
                saved_proxy_env+=("${v}=${!v}")
              fi
            done

            use_fallback=0
            for attempt in 1 2 3 4 5 6; do
              echo "Fetch attempt ${attempt}/6: ${fetch_url} @ ${TARGET_SHA}"
              if [[ $((attempt % 3)) -eq 0 && -n "${FALLBACK_PROXY}" ]]; then
                if [[ "${use_fallback}" -eq 0 ]]; then
                  echo "  routing through proxy ${FALLBACK_PROXY}"
                  for v in "${proxy_vars[@]}"; do
                    export "${v}=${FALLBACK_PROXY}"
                  done
                  use_fallback=1
                fi
              elif [[ "${use_fallback}" -eq 1 ]]; then
                unset "${proxy_vars[@]}"
                for entry in "${saved_proxy_env[@]}"; do
                  export "${entry}"
                done
                use_fallback=0
              fi
              if git -C "${ws}" fetch --no-tags --prune --no-recurse-submodules --depth=1 \
                origin "${TARGET_SHA}"; then
                break
              fi
              if [[ "${attempt}" -eq 6 ]]; then
                echo "ERROR: failed to fetch ${fetch_url} @ ${TARGET_SHA} after 6 attempts." >&2
                exit 1
              fi
              sleep "$((attempt * 15))"
            done
          else
            echo "Workspace HEAD already at ${TARGET_SHA}."
          fi

          # Always restore controlled (tracked) files to the target commit's
          # state, even when HEAD already matches: a previous run or interrupted
          # step may have modified or deleted tracked files, and tests must run
          # against the PR source. Untracked caches and previous logs are left
          # in place (the workflow uses clean: false).
          git -C "${ws}" reset --hard -q "${TARGET_SHA}"
          git -C "${ws}" checkout -q --detach "${TARGET_SHA}"
          dirty="$(git -C "${ws}" status --porcelain --untracked-files=no)"
          if [[ -n "${dirty}" ]]; then
            echo "ERROR: controlled files differ from target commit after restore:" >&2
            echo "${dirty}" >&2
            exit 1
          fi
          echo "Checkout OK at ${TARGET_SHA}: HEAD matches and controlled files are clean."

      - name: Record trigger summary
        shell: bash
        run: |
          set -euo pipefail
          echo "A5 smoke target repository: ${{ steps.trigger.outputs.repository }}"
          echo "A5 smoke target ref: ${{ steps.trigger.outputs.ref }}"
          echo "A5 smoke target sha: ${{ steps.trigger.outputs.sha }}"
          if [[ -n "${{ steps.trigger.outputs.pr_number }}" ]]; then
            echo "Triggered from PR #${{ steps.trigger.outputs.pr_number }}"
          fi

      - name: Resolve runner parameters
        shell: bash
        env:
          INPUT_DEVICE_ID: ${{ github.event.inputs.device_id || '' }}
          INPUT_ASCEND_HOME_PATH: ${{ github.event.inputs.ascend_home_path || '' }}
          DEFAULT_DEVICE_ID: ${{ vars.A5_SMOKE_DEVICE_ID }}
          DEFAULT_ASCEND_HOME_PATH: ${{ vars.A5_SMOKE_ASCEND_HOME_PATH }}
          DEFAULT_PYTHON_BIN_DIR: /home/pto/.conda/envs/a5ci/bin
          DEFAULT_CANN_SETENV_PATH: /usr/local/Ascend/cann-9.0.0/aarch64-linux/bin/setenv.bash
          DEFAULT_GTEST_PREFIX: /home/zoujiangjiangCI/.local/gtest
          DEFAULT_TOOLCHAIN_PATH_PREFIX: /usr/local/bin:/usr/bin:/bin:/usr/local/Ascend/cann-9.0.0/bin
        run: |
          set -euo pipefail

          device_id="${INPUT_DEVICE_ID:-${DEFAULT_DEVICE_ID:-0}}"
          ascend_home_path="${INPUT_ASCEND_HOME_PATH:-${DEFAULT_ASCEND_HOME_PATH:-}}"

          {
            echo "DEVICE_ID=${device_id}"
            echo "ASCEND_HOME_PATH=${ascend_home_path}"
            echo "A5_PYTHON_BIN_DIR=${DEFAULT_PYTHON_BIN_DIR}"
            echo "A5_CANN_SETENV_PATH=${DEFAULT_CANN_SETENV_PATH}"
            echo "A5_GTEST_PREFIX=${DEFAULT_GTEST_PREFIX}"
            echo "A5_TOOLCHAIN_PATH_PREFIX=${DEFAULT_TOOLCHAIN_PATH_PREFIX}"
          } >> "${GITHUB_ENV}"

      # Use a per-run unique log name so a failed/skipped attempt can never
      # replay a log written by an earlier run (the workspace persists between
      # runs because clean: false).
      - name: Run A5 smoke on self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./.github/scripts/a5/run_smoke.sh
          if ! command -v task-submit >/dev/null 2>&1; then
            echo "ERROR: task-submit is required so the non-root runner can submit A5 smoke to root." >&2
            exit 1
          fi

          log_file="a5_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.log"
          env_file="a5_smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.env"
          echo "A5_SMOKE_LOG_FILE=${log_file}" >> "${GITHUB_ENV}"
          echo "A5_SMOKE_ENV_FILE=${env_file}" >> "${GITHUB_ENV}"
          rm -f ./a5_smoke_*.log ./a5_smoke_*.env 2>/dev/null || true
          # Diagnostics are per run/attempt and are created by the root-run
          # script, which also fixes their ownership. Do NOT create or remove
          # the tree here: a stale root-owned parent is not writable by the
          # runner, and a fatal mkdir would abort before task-submit. Only
          # prune genuinely old per-run dirs, and never fail the job over it.
          find ./a5_smoke_diag -mindepth 1 -maxdepth 1 -type d -mtime +7 \
            -exec rm -rf {} + 2>/dev/null || true

          cat > "./${env_file}" <<EOF
          ASCEND_HOME_PATH=${ASCEND_HOME_PATH}
          A5_PYTHON_BIN_DIR=${A5_PYTHON_BIN_DIR}
          A5_CANN_SETENV_PATH=${A5_CANN_SETENV_PATH}
          A5_GTEST_PREFIX=${A5_GTEST_PREFIX}
          A5_TOOLCHAIN_PATH_PREFIX=${A5_TOOLCHAIN_PATH_PREFIX}
          A5_SMOKE_RUN_ID=${GITHUB_RUN_ID}
          A5_SMOKE_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          A5_SMOKE_TARGET_SHA=${{ steps.trigger.outputs.sha }}
          A5_SMOKE_DIAG_OWNER_UID=$(id -u)
          A5_SMOKE_DIAG_OWNER_GID=$(id -g)
          EOF

          task_args=(--env-file "./${env_file}" --timeout 0 --max-time 0)
          if [[ "${DEVICE_ID}" =~ ^[0-9]+$ ]]; then
            task_args+=(--device "${DEVICE_ID}")
          fi

          task-submit "${task_args[@]}" \
            --run "bash '${GITHUB_WORKSPACE}/.github/scripts/a5/run_smoke.sh'" \
            2>&1 | tee "./${log_file}"

      # Only the log produced by this attempt is printed. If no log exists,
      # the tests never started, and an old success summary must not be shown.
      - name: Print A5 smoke log tail
        if: always()
        shell: bash
        run: |
          log_file="${A5_SMOKE_LOG_FILE:-}"
          if [[ -n "${log_file}" && -f "./${log_file}" ]]; then
            echo "===== ${log_file} (tail -200) ====="
            tail -n 200 "./${log_file}" || true
          else
            echo "No A5 smoke log exists for this run/attempt; the smoke tests did not start"
            echo "(checkout or an earlier step failed before tests could run)."
          fi

      # Preserve the per-attempt log and the diagnostics saved by
      # run_smoke.sh (a5_smoke_diag/<run_id>-<attempt>/: input/golden bins,
      # cores, dmesg, versions) so a future crash leaves evidence
      # (issue #388). Only this run/attempt's files are referenced; the env
      # file is named per attempt so a stale copy from an earlier run can
      # never be uploaded as this attempt's result.
      # continue-on-error keeps a flaky artifact upload from failing a green
      # smoke run.
      - name: Upload A5 smoke diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: a5-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            a5_smoke_${{ github.run_id }}_${{ github.run_attempt }}.log
            a5_smoke_${{ github.run_id }}_${{ github.run_attempt }}.env
            a5_smoke_diag/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7
